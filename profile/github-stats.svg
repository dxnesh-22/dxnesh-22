Build • Learn • Grow
</text>

<!-- Right-side activity circle -->

<circle cx="735" cy="235" r="92"
fill="#07182E"
stroke="#126AC0"
stroke-width="2"/>

<circle cx="735" cy="235" r="72"
fill="none"
stroke="#123A65"
stroke-width="12"/>

<circle cx="735" cy="235" r="72"
fill="none"
stroke="url(#blue)"
stroke-width="12"
stroke-linecap="round"
stroke-dasharray="320 452"
transform="rotate(-90 735 235)"
filter="url(#glow)"/>

<text x="735" y="230"
text-anchor="middle"
font-family="Arial"
font-size="42"
font-weight="bold"
fill="#FFFFFF">
28
</text>

<text x="735" y="258"
text-anchor="middle"
font-family="Arial"
font-size="13"
fill="#64C7FF">
CONTRIBUTIONS
</text>

<text x="735" y="365"
text-anchor="middle"
font-family="Arial"
font-size="13"
letter-spacing="3"
fill="#168CFF">
KEEP BUILDING 🚀
</text>

</svg>
